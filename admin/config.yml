backend:
  name: git-gateway
  branch: main

# Χρησιμοποιεί το Netlify Identity + Git Gateway για login —
# ο χρήστης βλέπει απλή φόρμα email/password, όχι GitHub.
publish_mode: simple
media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

locale: "en"

collections:
  - name: "blog_en"
    label: "Blog (English)"
    files:
      - name: "articles"
        label: "Άρθρα"
        file: "content/blog-en.json"
        fields:
          - { label: "Άρθρα", name: "articles", widget: "list", label_singular: "Άρθρο", summary: "{{title}}", fields: [
              { label: "Αναγνωριστικό (id)", name: "id", widget: "string", hint: "Μοναδικό, μόνο λατινικά/παύλες, χωρίς κενά — π.χ. my-new-article. Χρησιμοποιείται στη διεύθυνση της σελίδας του άρθρου. Μην το αλλάξεις αφού δημοσιευτεί." },
              { label: "Τίτλος", name: "title", widget: "string" },
              { label: "Περιγραφή (σύντομη, για την κάρτα)", name: "description", widget: "text" },
              { label: "Πλήρες κείμενο άρθρου", name: "body", widget: "markdown", required: false, hint: "Αν το αφήσεις κενό, στη σελίδα του άρθρου θα εμφανιστεί μόνο η σύντομη περιγραφή." },
              { label: "Κύρια εικόνα (featured);", name: "featured", widget: "boolean", default: false, hint: "Ενεργοποίησε το μόνο σε ΕΝΑ άρθρο — αυτό εμφανίζεται μεγάλο πάνω-πάνω." },
              { label: "Ετικέτα (π.χ. New)", name: "badge", widget: "string", required: false },
              { label: "Κατηγορία (εμφάνιση)", name: "category_label", widget: "select", options: ["Pole & Aerial", "Salsa & Bachata", "Events & Festivals", "Health & Wellness", "Studio News"] },
              { label: "Κατηγορίες φίλτρου", name: "categories", widget: "select", multiple: true, options: ["pole-aerial", "latin", "events", "wellness", "studio"] },
              { label: "Εικόνα", name: "image", widget: "image" },
              { label: "Εναλλακτικό κείμενο εικόνας", name: "image_alt", widget: "string", required: false },
              { label: "Ημερομηνία (εμφάνιση, π.χ. 27 May)", name: "date_label", widget: "string" },
              { label: "Χρόνος ανάγνωσης (π.χ. 2 min read)", name: "read_time", widget: "string" },
              { label: "Εξωτερικό link (προαιρετικό)", name: "link", widget: "string", required: false, hint: "Συμπλήρωσέ το ΜΟΝΟ αν το άρθρο ζει ήδη σε άλλο site. Αν το αφήσεις κενό, το άρθρο θα ανοίγει σε δική του σελίδα μέσα στο site μας." },
            ] }

  - name: "blog_el"
    label: "Blog (Ελληνικά)"
    files:
      - name: "articles"
        label: "Άρθρα"
        file: "content/blog-el.json"
        fields:
          - { label: "Άρθρα", name: "articles", widget: "list", label_singular: "Άρθρο", summary: "{{title}}", fields: [
              { label: "Αναγνωριστικό (id)", name: "id", widget: "string", hint: "Μοναδικό, μόνο λατινικά/παύλες, χωρίς κενά — π.χ. neo-arthro. Χρησιμοποιείται στη διεύθυνση της σελίδας του άρθρου. Μην το αλλάξεις αφού δημοσιευτεί." },
              { label: "Τίτλος", name: "title", widget: "string" },
              { label: "Περιγραφή (σύντομη, για την κάρτα)", name: "description", widget: "text" },
              { label: "Πλήρες κείμενο άρθρου", name: "body", widget: "markdown", required: false, hint: "Αν το αφήσεις κενό, στη σελίδα του άρθρου θα εμφανιστεί μόνο η σύντομη περιγραφή." },
              { label: "Featured (μεγάλη κάρτα πάνω-πάνω)", name: "featured", widget: "boolean", default: false, hint: "Ενεργοποίησε το μόνο σε ΕΝΑ άρθρο." },
              { label: "Ετικέτα (π.χ. Νέο)", name: "badge", widget: "string", required: false },
              { label: "Κατηγορία (εμφάνιση)", name: "category_label", widget: "select", options: ["Pole & Aerial", "Salsa & Bachata", "Events & Festivals", "Υγεία & Ευεξία", "Νέα Studio"] },
              { label: "Κατηγορίες φίλτρου", name: "categories", widget: "select", multiple: true, options: ["pole-aerial", "latin", "events", "wellness", "studio"] },
              { label: "Εικόνα", name: "image", widget: "image" },
              { label: "Εναλλακτικό κείμενο εικόνας", name: "image_alt", widget: "string", required: false },
              { label: "Ημερομηνία (εμφάνιση, π.χ. 27 Μαΐου)", name: "date_label", widget: "string" },
              { label: "Χρόνος ανάγνωσης (π.χ. 2 λεπτά ανάγνωση)", name: "read_time", widget: "string" },
              { label: "Εξωτερικό link (προαιρετικό)", name: "link", widget: "string", required: false, hint: "Συμπλήρωσέ το ΜΟΝΟ αν το άρθρο ζει ήδη σε άλλο site. Αν το αφήσεις κενό, το άρθρο θα ανοίγει σε δική του σελίδα μέσα στο site μας." },
            ] }

  - name: "site_notice"
    label: "Ανακοίνωση (κοινή σε Classes & Pricing)"
    files:
      - name: "en"
        label: "English"
        file: "content/site-notice-en.json"
        fields:
          - { label: "Badge (1 σύμβολο/γράμμα)", name: "badge", widget: "string" }
          - { label: "Τίτλος", name: "title", widget: "string" }
          - { label: "Παράγραφοι", name: "paragraphs", widget: "list", label_singular: "Παράγραφος", field: { label: "Κείμενο", name: "paragraph", widget: "text" } }
      - name: "el"
        label: "Ελληνικά"
        file: "content/site-notice-el.json"
        fields:
          - { label: "Badge (1 σύμβολο/γράμμα)", name: "badge", widget: "string" }
          - { label: "Τίτλος", name: "title", widget: "string" }
          - { label: "Παράγραφοι", name: "paragraphs", widget: "list", label_singular: "Παράγραφος", field: { label: "Κείμενο", name: "paragraph", widget: "text" } }

  - name: "classes"
    label: "Μαθήματα (σελίδα Classes)"
    files:
      - name: "en"
        label: "English"
        file: "content/classes-en.json"
        fields:
          - { label: "Gallery (4 φωτογραφίες πάνω-πάνω)", name: "gallery", widget: "list", label_singular: "Φωτογραφία", summary: "{{label}}", fields: [
              { label: "Εικόνα", name: "image", widget: "image" },
              { label: "Alt text", name: "alt", widget: "string" },
              { label: "Ετικέτα", name: "label", widget: "string" },
            ] }
          - { label: "Κατηγορίες μαθημάτων", name: "categories", widget: "list", label_singular: "Κατηγορία", summary: "{{name}}", fields: [
              { label: "Όνομα κατηγορίας", name: "name", widget: "string" },
              { label: "Υπότιτλος", name: "subtitle", widget: "string" },
              { label: "Μαθήματα", name: "cards", widget: "list", label_singular: "Μάθημα", summary: "{{title}}", fields: [
                  { label: "Τίτλος μαθήματος", name: "title", widget: "string" },
                  { label: "Περιγραφή", name: "description", widget: "text" },
                  { label: "Επίπεδο / πλαίσιο", name: "level", widget: "string" },
                  { label: "Ετικέτα (π.χ. New)", name: "badge", widget: "string", required: false },
                  { label: "Εικόνα (προαιρετική)", name: "image", widget: "image", required: false },
                  { label: "Alt text εικόνας", name: "image_alt", widget: "string", required: false },
                ] },
            ] }
      - name: "el"
        label: "Ελληνικά"
        file: "content/classes-el.json"
        fields:
          - { label: "Gallery (4 φωτογραφίες πάνω-πάνω)", name: "gallery", widget: "list", label_singular: "Φωτογραφία", summary: "{{label}}", fields: [
              { label: "Εικόνα", name: "image", widget: "image" },
              { label: "Alt text", name: "alt", widget: "string" },
              { label: "Ετικέτα", name: "label", widget: "string" },
            ] }
          - { label: "Κατηγορίες μαθημάτων", name: "categories", widget: "list", label_singular: "Κατηγορία", summary: "{{name}}", fields: [
              { label: "Όνομα κατηγορίας", name: "name", widget: "string" },
              { label: "Υπότιτλος", name: "subtitle", widget: "string" },
              { label: "Μαθήματα", name: "cards", widget: "list", label_singular: "Μάθημα", summary: "{{title}}", fields: [
                  { label: "Τίτλος μαθήματος", name: "title", widget: "string" },
                  { label: "Περιγραφή", name: "description", widget: "text" },
                  { label: "Επίπεδο / πλαίσιο", name: "level", widget: "string" },
                  { label: "Ετικέτα (π.χ. Νέο)", name: "badge", widget: "string", required: false },
                  { label: "Εικόνα (προαιρετική)", name: "image", widget: "image", required: false },
                  { label: "Alt text εικόνας", name: "image_alt", widget: "string", required: false },
                ] },
            ] }

  - name: "pricing"
    label: "Τιμές (σελίδα Pricing)"
    files:
      - name: "en"
        label: "English"
        file: "content/pricing-en.json"
        fields:
          - { label: "Ανακοίνωση εκπτώσεων (πάνω από τα πακέτα)", name: "discount_notice", widget: "object", fields: [
              { label: "Badge (1 σύμβολο/γράμμα)", name: "badge", widget: "string" },
              { label: "Τίτλος", name: "title", widget: "string" },
              { label: "Κείμενο", name: "text", widget: "text" },
            ] }
          - { label: "Σύνδεσμος online πληρωμής", name: "pay_online_url", widget: "string" }
          - { label: "Κείμενο κουμπιού online πληρωμής", name: "pay_online_label", widget: "string" }
          - { label: "Ομάδες τιμών", name: "groups", widget: "list", label_singular: "Ομάδα", summary: "{{name}}", fields: [
              { label: "Τύπος", name: "type", widget: "select", options: [{ label: "Κανονικό πλαίσιο τιμών (price-block)", value: "regular" }, { label: "Drop-in πλαίσιο (σκούρο)", value: "dropin" }], default: "regular" },
              { label: "Όνομα μαθήματος / ομάδας", name: "name", widget: "string" },
              { label: "Ετικέτα δίπλα στο όνομα (π.χ. Price to be confirmed)", name: "name_tag", widget: "string", required: false },
              { label: "Tier label (π.χ. Monthly, Annual, Single class)", name: "tier_label", widget: "string" },
              { label: "Εισαγωγικό κείμενο (μόνο για Drop-in)", name: "lead", widget: "text", required: false },
              { label: "Ενότητες τιμών", name: "sections", widget: "list", label_singular: "Ενότητα", summary: "{{label}}", fields: [
                  { label: "Ετικέτα ενότητας (κενό = καμία, χρησιμοποιεί το tier label από πάνω)", name: "label", widget: "string", required: false },
                  { label: "Ετικέτα δίπλα στην ενότητα (π.χ. Indicative prices)", name: "tag", widget: "string", required: false },
                  { label: "Γραμμές τιμών", name: "rows", widget: "list", label_singular: "Γραμμή", summary: "{{name}} — {{amount}}", fields: [
                      { label: "Ποσότητα / σύμβολο (π.χ. 1, 2, 1+1, •)", name: "qty", widget: "string" },
                      { label: "Όνομα", name: "name", widget: "string" },
                      { label: "Υποσημείωση (μικρό κείμενο κάτω από το όνομα)", name: "note", widget: "string", required: false },
                      { label: "Ποσό (π.χ. 40€ ή Contact us)", name: "amount", widget: "string" },
                      { label: "Τιμή προς επιβεβαίωση (TBC/TBD στυλ);", name: "tbd", widget: "boolean", default: false },
                    ] },
                ] },
              { label: "Σημείωση ισχύος (κάτω από τις τιμές)", name: "valid_note", widget: "text", required: false },
              { label: "Επιπλέον γραμμές (μετά τη σημείωση ισχύος)", name: "extra_rows", widget: "list", label_singular: "Γραμμή", required: false, summary: "{{name}} — {{amount}}", fields: [
                  { label: "Ποσότητα / σύμβολο", name: "qty", widget: "string" },
                  { label: "Όνομα", name: "name", widget: "string" },
                  { label: "Υποσημείωση", name: "note", widget: "string", required: false },
                  { label: "Ποσό", name: "amount", widget: "string" },
                  { label: "Τιμή προς επιβεβαίωση (TBC/TBD στυλ);", name: "tbd", widget: "boolean", default: false },
                ] },
              { label: "Εμφάνιση κουμπιού online πληρωμής;", name: "pay_online", widget: "boolean", default: false },
            ] }
      - name: "el"
        label: "Ελληνικά"
        file: "content/pricing-el.json"
        fields:
          - { label: "Ανακοίνωση εκπτώσεων (πάνω από τα πακέτα)", name: "discount_notice", widget: "object", fields: [
              { label: "Badge (1 σύμβολο/γράμμα)", name: "badge", widget: "string" },
              { label: "Τίτλος", name: "title", widget: "string" },
              { label: "Κείμενο", name: "text", widget: "text" },
            ] }
          - { label: "Σύνδεσμος online πληρωμής", name: "pay_online_url", widget: "string" }
          - { label: "Κείμενο κουμπιού online πληρωμής", name: "pay_online_label", widget: "string" }
          - { label: "Ομάδες τιμών", name: "groups", widget: "list", label_singular: "Ομάδα", summary: "{{name}}", fields: [
              { label: "Τύπος", name: "type", widget: "select", options: [{ label: "Κανονικό πλαίσιο τιμών (price-block)", value: "regular" }, { label: "Drop-in πλαίσιο (σκούρο)", value: "dropin" }], default: "regular" },
              { label: "Όνομα μαθήματος / ομάδας", name: "name", widget: "string" },
              { label: "Ετικέτα δίπλα στο όνομα (π.χ. Τιμή υπό επιβεβαίωση)", name: "name_tag", widget: "string", required: false },
              { label: "Tier label (π.χ. Μηνιαία, Ετήσια, Μεμονωμένη επίσκεψη)", name: "tier_label", widget: "string" },
              { label: "Εισαγωγικό κείμενο (μόνο για Drop-in)", name: "lead", widget: "text", required: false },
              { label: "Ενότητες τιμών", name: "sections", widget: "list", label_singular: "Ενότητα", summary: "{{label}}", fields: [
                  { label: "Ετικέτα ενότητας (κενό = καμία, χρησιμοποιεί το tier label από πάνω)", name: "label", widget: "string", required: false },
                  { label: "Ετικέτα δίπλα στην ενότητα (π.χ. Ενδεικτικές τιμές)", name: "tag", widget: "string", required: false },
                  { label: "Γραμμές τιμών", name: "rows", widget: "list", label_singular: "Γραμμή", summary: "{{name}} — {{amount}}", fields: [
                      { label: "Ποσότητα / σύμβολο (π.χ. 1, 2, 1+1, •)", name: "qty", widget: "string" },
                      { label: "Όνομα", name: "name", widget: "string" },
                      { label: "Υποσημείωση (μικρό κείμενο κάτω από το όνομα)", name: "note", widget: "string", required: false },
                      { label: "Ποσό (π.χ. 40€ ή Κατόπιν επικοινωνίας)", name: "amount", widget: "string" },
                      { label: "Τιμή προς επιβεβαίωση (TBC/TBD στυλ);", name: "tbd", widget: "boolean", default: false },
                    ] },
                ] },
              { label: "Σημείωση ισχύος (κάτω από τις τιμές)", name: "valid_note", widget: "text", required: false },
              { label: "Επιπλέον γραμμές (μετά τη σημείωση ισχύος)", name: "extra_rows", widget: "list", label_singular: "Γραμμή", required: false, summary: "{{name}} — {{amount}}", fields: [
                  { label: "Ποσότητα / σύμβολο", name: "qty", widget: "string" },
                  { label: "Όνομα", name: "name", widget: "string" },
                  { label: "Υποσημείωση", name: "note", widget: "string", required: false },
                  { label: "Ποσό", name: "amount", widget: "string" },
                  { label: "Τιμή προς επιβεβαίωση (TBC/TBD στυλ);", name: "tbd", widget: "boolean", default: false },
                ] },
              { label: "Εμφάνιση κουμπιού online πληρωμής;", name: "pay_online", widget: "boolean", default: false },
            ] }
  - name: "about"
    label: "Σχετικά (σελίδα About)"
    files:
      - name: "en"
        label: "English"
        file: "content/about-en.json"
        fields:
          - { label: "Στατιστικά (ακριβώς 4)", name: "stats", widget: "list", label_singular: "Στατιστικό", summary: "{{num}} — {{label}}", fields: [
              { label: "Αριθμός / σύμβολο (π.χ. 2011, 15+, 1st, 3)", name: "num", widget: "string" },
              { label: "Ετικέτα", name: "label", widget: "string" },
            ] }
          - { label: "Κείμενο ιστορίας (παράγραφοι σε HTML, π.χ. <p>...</p>)", name: "prose", widget: "text" }
          - { label: "Απόφθεγμα (quote)", name: "quote", widget: "string" }
          - { label: "Κάρτες \"Τι μας κάνει διαφορετικούς\" (ακριβώς 6)", name: "cards", widget: "list", label_singular: "Κάρτα", summary: "{{title}}", fields: [
              { label: "Τίτλος", name: "title", widget: "string" },
              { label: "Περιγραφή", name: "desc", widget: "text" },
            ] }
      - name: "el"
        label: "Ελληνικά"
        file: "content/about-el.json"
        fields:
          - { label: "Στατιστικά (ακριβώς 4)", name: "stats", widget: "list", label_singular: "Στατιστικό", summary: "{{num}} — {{label}}", fields: [
              { label: "Αριθμός / σύμβολο (π.χ. 2011, 15+, 1η, 3)", name: "num", widget: "string" },
              { label: "Ετικέτα", name: "label", widget: "string" },
            ] }
          - { label: "Κείμενο ιστορίας (παράγραφοι σε HTML, π.χ. <p>...</p>)", name: "prose", widget: "text" }
          - { label: "Απόφθεγμα (quote)", name: "quote", widget: "string" }
          - { label: "Κάρτες \"Τι μας κάνει διαφορετικούς\" (ακριβώς 6)", name: "cards", widget: "list", label_singular: "Κάρτα", summary: "{{title}}", fields: [
              { label: "Τίτλος", name: "title", widget: "string" },
              { label: "Περιγραφή", name: "desc", widget: "text" },
            ] }
